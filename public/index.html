<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B7BB9">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>白馬滑雪團 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: sticker-card itinerary on a snowy gingham ground; sticky day tabs; one column, phone first */
:root{
  --bg:#E9F1F7; --check:rgba(120,165,205,.16); --card:#FFFFFF; --card2:#F3F8FC;
  --ink:#17263C; --muted:#4F6580; --line:#17263C; --soft:#D6E5F1;
  --red:#D2412A; --yellow:#F2B33D; --ok:#2E8B57; --okbg:#DDF1E5; --warn:#B4531A; --warnbg:#FCE9D6;
  --past:#8A9AAE; --day:#2B7BB9; --on-day:#FFFFFF;
  --f-display:"Noto Sans TC","Noto Sans JP","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Noto Sans JP","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Nunito","Noto Sans TC",system-ui,sans-serif;
}
:root[lang="ja"]{--f-display:"Noto Sans JP","Noto Sans TC","Hiragino Sans",system-ui,sans-serif;--f-body:"Noto Sans JP","Noto Sans TC","Hiragino Sans",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101A27; --check:rgba(110,150,200,.07); --card:#1B293B; --card2:#213247;
  --ink:#E7EFF8; --muted:#A3B6CC; --line:#05090F; --soft:#2A3D55;
  --red:#F06A50; --yellow:#F2B33D; --ok:#6FD19A; --okbg:#173A2A; --warn:#FFB27A; --warnbg:#3D2715; --past:#6E8096; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101A27; --check:rgba(110,150,200,.07); --card:#1B293B; --card2:#213247;
  --ink:#E7EFF8; --muted:#A3B6CC; --line:#05090F; --soft:#2A3D55;
  --red:#F06A50; --yellow:#F2B33D; --ok:#6FD19A; --okbg:#173A2A; --warn:#FFB27A; --warnbg:#3D2715; --past:#6E8096; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:repeating-linear-gradient(45deg,var(--check) 0 16px,transparent 16px 32px),repeating-linear-gradient(-45deg,var(--check) 0 16px,transparent 16px 32px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:3px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.langs{display:flex;border:3px solid var(--line);border-radius:999px;overflow:hidden;box-shadow:0 3px 0 var(--line);flex:none}
.langs button{border:0;background:var(--card);padding:4px 12px;font-weight:900;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:999px;background:var(--card);padding:4px 12px 4px 8px;cursor:pointer;box-shadow:0 3px 0 var(--line);line-height:1.15;text-align:left}
.tab .e{font-size:20px}
.tab b{display:block;font-family:var(--f-num);font-weight:900;font-size:14px}
.tab small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.tab[aria-selected="true"]{background:var(--tc,var(--day));color:#fff}
.tab[aria-selected="true"] small{color:#fff;opacity:.9}
.tab .live{width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
.tab.today .live{display:inline-block}

/* hero */
.hero{position:relative;background:var(--day);color:var(--on-day);border-bottom:3px solid var(--line);overflow:hidden}
.hero .wrap{position:relative;z-index:2;padding-block:26px 150px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,11vw,68px);line-height:1.02;margin:0 0 14px;text-wrap:balance;
  text-shadow:3px 3px 0 var(--line),0 0 0 #000}
.hero .lead{max-width:36em;font-weight:500;margin:12px 0 0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.chip.y{background:var(--yellow);color:#17263C}
.chip.r{background:var(--red);color:#fff}
.scene{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1}
.scene svg{width:100%;height:100%;display:block}
.props{position:absolute;bottom:14px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;font-size:40px;z-index:2;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.25))}
.snow{position:absolute;inset:0;pointer-events:none;z-index:1}
.flake{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(30px,420px)}}
@media (prefers-reduced-motion:reduce){.flake{animation:none;display:none}.pulse{animation:none!important}}

main{padding-block:22px 120px}
main>.wrap{display:flex;flex-direction:column;gap:30px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.sh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tag{display:inline-block;font-family:var(--f-display);font-weight:900;font-size:clamp(22px,6vw,30px);color:#fff;background:var(--tagc,var(--day));border:3px solid var(--line);border-radius:14px;padding:2px 18px 4px;box-shadow:0 5px 0 var(--line);transform:rotate(-1.5deg)}
.sh .sub{color:var(--muted);font-weight:700;font-size:14px}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:0 6px 0 var(--line);padding:18px 18px}
.card h3{margin:0 0 6px;font-family:var(--f-display);font-weight:900;font-size:19px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* status */
.status{display:flex;flex-direction:column;gap:10px}
.status .big{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:28px;color:var(--red);line-height:1.2}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.5}}
.sim{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;border-top:2px dashed var(--soft);padding-top:10px}
.sim input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--card2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--line);border-radius:999px;background:var(--card);padding:6px 16px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--line);text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.y{background:var(--yellow);color:#17263C}
.btn.d{background:var(--day);color:#fff}
.btn.sm{padding:3px 12px;font-size:14px;box-shadow:0 3px 0 var(--line)}

/* tasks (transport bookings) */
.tasks{display:flex;flex-direction:column;gap:14px}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.task.done{opacity:.62}
.task.done h3{text-decoration:line-through}
.cb{appearance:none;width:30px;height:30px;border:3px solid var(--line);border-radius:9px;background:var(--card2);cursor:pointer;margin:2px 0 0;display:grid;place-content:center}
.cb:checked{background:var(--ok)}
.cb:checked::after{content:"✓";color:#fff;font-weight:900;font-size:18px;line-height:1}
.task-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.task-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:900;border-radius:999px;padding:2px 10px;border:2px solid currentColor;white-space:nowrap}
.pill.wait{color:var(--muted)}
.pill.open{color:var(--ok);background:var(--okbg)}
.pill.now{color:#fff;background:var(--red);border-color:var(--red)}
.pill.done{color:var(--ok)}
.pill.must{color:#fff;background:var(--red);border-color:var(--red)}
.pill.warn{color:var(--warn);background:var(--warnbg)}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);font-weight:700}
.alert{border:3px solid var(--warn);background:var(--warnbg);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:15px}
.alert b{color:var(--warn)}
.links{display:flex;flex-wrap:wrap;gap:8px}

/* jp phrase */
.jp{display:flex;align-items:center;gap:10px;border:2px dashed var(--day);border-radius:14px;padding:8px 12px;background:var(--card2);cursor:pointer;text-align:left;width:100%}
.jp .ja{font-family:"Noto Sans JP",var(--f-body);font-weight:700;font-size:16px;display:block;line-height:1.45}
.jp .mean{display:block;font-size:13px;color:var(--muted)}
.jp .ic{flex:none;font-size:13px;font-weight:900;color:#fff;background:var(--day);border-radius:8px;padding:2px 6px}
.phr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.phr-cat{font-weight:900;font-size:15px;margin-top:6px}

/* overlay */
.ov{position:fixed;inset:0;z-index:60;background:var(--card);color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));text-align:center}
.ov .ja{font-family:"Noto Sans JP",var(--f-body);font-weight:900;font-size:clamp(30px,8vw,56px);line-height:1.35;max-width:16em;text-wrap:balance}
.ov .mean{color:var(--muted);font-size:18px;max-width:30em}

/* route strip */
.route{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:800}
.route .stop{border:3px solid var(--line);border-radius:12px;background:var(--card);padding:4px 10px;box-shadow:0 3px 0 var(--line);font-size:14px}
.route .stop small{display:block;font-size:11px;color:var(--muted)}
.route .arr{color:var(--muted)}

.daygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.daycard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:0;overflow:hidden}
.daycard .band{background:var(--dc);color:#fff;padding:10px 14px;border-bottom:3px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.daycard .band b{font-family:var(--f-num);font-weight:900;font-size:18px}
.daycard .band span{font-size:26px}
.daycard .inner{padding:4px 14px 14px;display:flex;flex-direction:column;gap:4px}
.daycard h3{margin:0;font-size:17px}

/* cost table */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{text-align:left;padding:8px 8px;border-bottom:2px solid var(--soft);vertical-align:top}
th{font-size:13px;color:var(--muted)}
td.r,th.r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:900;border-bottom:0}

/* timeline */
.tl{display:flex;flex-direction:column;gap:16px}
.ti{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start}
.clock{width:66px;height:66px;border-radius:50%;border:3px dashed var(--day);background:var(--card);display:grid;place-content:center;font-family:var(--f-num);font-weight:900;font-size:16px;color:var(--ink)}
.ti .card{padding:14px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.ti .head{display:flex;gap:10px;align-items:flex-start}
.ti .ico{font-size:28px;line-height:1;flex:none;margin-top:2px}
.ti .htxt{min-width:0;flex:1}
.ti h3{margin:0;font-size:18px;line-height:1.35}
.ti .when{font-family:var(--f-num);font-weight:800;font-size:14px;color:var(--muted)}
.ti .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ti .chev{flex:none;font-weight:900;color:var(--muted);transition:transform .2s}
.ti.open .chev{transform:rotate(90deg)}
.ti .det{display:none;flex-direction:column;gap:10px;border-top:2px dashed var(--soft);padding-top:10px;margin-top:4px;cursor:auto}
.ti.open .det{display:flex}
.kv{display:grid;grid-template-columns:4.6em 1fr;gap:4px 10px;font-size:15px}
:root[lang="en"] .kv{grid-template-columns:5.6em 1fr}
.kv dt{font-weight:900;color:var(--muted);font-size:13px;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ti.past .card{background:var(--card2);box-shadow:0 3px 0 var(--line)}
.ti.past .card h3,.ti.past .ico{opacity:.55}
.ti.past .clock{border-color:var(--past);color:var(--past)}
.ti.past .clock::after{content:"✓";display:block;text-align:center;font-size:13px;margin-top:-2px}
.ti.now .card{background:color-mix(in srgb,var(--yellow) 30%,var(--card));border-color:var(--line);box-shadow:0 6px 0 var(--line),0 0 0 5px color-mix(in srgb,var(--yellow) 60%,transparent)}
.ti.now .clock{background:var(--red);color:#fff;border:3px solid var(--line)}
.nowflag{display:none}
.ti.now .nowflag{display:inline-flex}
.gap-now{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--red);padding-left:80px}

/* checklist */
.chk{display:flex;flex-direction:column;gap:10px}
.chk label{display:flex;gap:12px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--line);cursor:pointer;font-weight:700}
.chk label .t{flex:1;min-width:0}
.chk label.on .t{text-decoration:line-through;opacity:.55}
.bar{height:16px;border:3px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* bingo */
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{aspect-ratio:1/1;max-width:100%;border:3px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;cursor:pointer;text-align:center;font-weight:800;font-size:clamp(12px,3.4vw,16px);line-height:1.25}
.cell:nth-child(odd){transform:rotate(-1deg)}
.cell:nth-child(even){transform:rotate(1deg)}
.cell .e{font-size:clamp(26px,8vw,40px);line-height:1}
.cell.on{background:var(--day);color:#fff}
.cell.win{background:var(--red);color:#fff}
.bingo-msg{font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--red);min-height:1.4em}

/* eats */
.eat{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:2px dashed var(--soft)}
.eat:last-child{border-bottom:0;padding-bottom:0}
.eat:first-child{padding-top:0}
.eat h4{margin:0;font-size:17px}

.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* simple page */
.simple h2{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.sday{all:unset;cursor:pointer;display:block;width:100%}
.sday:focus-visible{outline:3px solid var(--yellow)}
.simple.today{box-shadow:0 6px 0 var(--line),0 0 0 5px color-mix(in srgb,var(--yellow) 60%,transparent)}
.srow.past{opacity:.45}
.srow.past>.num::after{content:' ✓'}
.srow.now{background:color-mix(in srgb,var(--yellow) 30%,var(--card));border-radius:10px;padding-inline:6px;font-weight:700}
.simple{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:7.2em 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--soft);font-size:15px}
.srow .num{font-weight:800}

/* fx */
.fxbtn{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:var(--yellow);color:#17263C;font-family:var(--f-num);font-weight:900;font-size:15px;box-shadow:0 5px 0 var(--line);cursor:pointer;line-height:1.05}
.fx{position:fixed;z-index:41;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px}
.fx label{font-weight:800;font-size:14px;display:flex;flex-direction:column;gap:4px}
.fx input{font:inherit;font-family:var(--f-num);font-weight:800;font-size:22px;border:3px solid var(--line);border-radius:12px;padding:6px 10px;width:100%;background:var(--card2);color:var(--ink)}
.fx .q{display:flex;flex-wrap:wrap;gap:6px}
.foot{color:var(--muted);font-size:13px;text-align:center}
.gbtn{align-self:flex-start;margin-top:6px;border:3px solid var(--line);border-radius:999px;background:var(--yellow);color:#17263C;font-weight:900;font-size:14px;padding:3px 12px;box-shadow:0 3px 0 var(--line);cursor:pointer}
.helpbtn{width:36px;height:36px;border:3px solid var(--line);border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--line);cursor:pointer;font-size:16px;display:grid;place-content:center;padding:0}
.hub{display:flex;flex-direction:column;gap:14px}
.hub summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-size:17px;list-style:none}
.hub summary::-webkit-details-marker{display:none}
.hub summary::after{content:'▾';margin-left:auto;color:var(--muted)}
.hub details:not([open]) summary::after{content:'▸'}
.hublist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hublist li{display:flex;gap:10px;align-items:flex-start;padding-bottom:10px;border-bottom:2px dashed var(--soft)}
.hublist li:last-child{border-bottom:0;padding-bottom:0}
.hublist li>span{font-size:22px;line-height:1.2}
.tipcard{background:color-mix(in srgb,var(--day) 14%,var(--card));line-height:1.8}
.tiplbl{color:var(--red);font-weight:900;font-family:var(--f-display);margin-right:6px}
.bye{font-family:"Noto Sans JP",var(--f-display);font-weight:900;font-size:clamp(24px,7vw,40px);color:var(--red);text-align:center;margin-top:20px;text-wrap:balance}
.srcs{line-height:1.9;max-width:60em;margin:0 auto}
.srcs a{color:var(--ink)}
.mecard{display:flex;flex-direction:column;gap:8px}
.mecard.need{box-shadow:0 6px 0 var(--line),0 0 0 5px color-mix(in srgb,var(--red) 45%,transparent)}
.mecard input,.pinIn{font:inherit;border:3px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--card2);color:var(--ink);min-width:0;flex:1}
.gbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gbtns .gbtn{margin-top:0}
.gbtn.ob{background:var(--card);color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:16px}
.opt{display:flex;flex-direction:column;gap:10px}
.opt.rec{border-color:var(--line);box-shadow:0 6px 0 var(--line),0 0 0 4px color-mix(in srgb,var(--yellow) 55%,transparent)}
.opt.mine{background:color-mix(in srgb,var(--day) 10%,var(--card))}
.opt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.opt h3{margin:0;font-size:18px}

function guideHTML(id){
 const g=GUIDES[id];if(!g)return '';
 const vk=g.v==='ok'?'open':'warn';
 return `<div class="gwrap"><div class="ghead"><button class="btn sm" type="button" data-gclose>${U('back2')}</button><span class="pill ${vk}">${U('v_'+g.v)}</span></div>
 <h2 class="gtitle">${esc(L(g.t))}</h2>
 <ol class="gsteps">${g.steps.map(s=>`<li><div>${esc(L(s[0]))}</div>${s[1]?`<div class="sign"><span class="lbl">${U('lookFor')}</span><span class="txt">${esc(s[1])}</span></div>`:''}${s[2]?`<a class="small" href="${gmap(s[2])}" target="_blank" rel="noopener">📍 ${U('openMapSV')}</a>`:''}</li>`).join('')}</ol>
 ${g.tips.length?`<div class="card small"><b>💡</b> ${g.tips.map(t=>esc(L(t))).join('<br>')}</div>`:''}
 <p class="small muted">${U('guideNote')}</p></div>`;
}
function openGuide(id){const el=document.getElementById('guide');el.innerHTML=guideHTML(id);el.hidden=false;el.scrollTop=0;el.dataset.g=id}

function voteTally(key){
 const t={};let mine=null;
 if(SYNC.db&&SYNC.crewOK){Object.entries(SYNC.crew).forEach(([id,c])=>{const v=c&&c.votes&&c.votes[key];if(v!=null){(t[v]=t[v]||[]).push(id)}});mine=myState().votes[key]}
 else{mine=myState().votes[key];if(mine!=null)t[mine]=['local']}
 return {t,mine};
}

  <div class="small muted">${esc(L(o[1]))}</div>

  <dt>${U('per')}</dt><dd class="num"><b>${yen0(o[5][0],o[5][1])}</b></dd><dt>${U('all')}</dt><dd class="num">${yen0(o[5][0]*GROUP,o[5][1]*GROUP)}</dd></dl>
  <div class="pc"><div><b style="color:var(--ok)">＋</b> ${esc(L(o[6]))}</div><div><b style="color:var(--red)">－</b> ${esc(L(o[7]))}</div></div>
  <div class="vrow"><button class="btn sm ${mine===i?'d':''}" type="button" data-vote="${key}" data-oi="${i}">${mine===i?'✓ '+U('myPick'):U('pickThis')}</button>
  ${SYNC.db&&SYNC.crewOK?`<span class="small muted">${voters.length?`${U('votes',voters.length)}：${voters.map(id=>esc(who(id))).join('、')}`:''}</span>`:''}</div>

function prepState(it){
 if(taskDone(it[0]))return {k:'done',txt:U('doneP')};
 if(!it[1])return {k:'open',txt:U('anyTime')};
 const d=daysBetween(nowTs(),it[1]);
 if(d>0)return {k:d<=14?'warn':'wait',txt:U('dueIn',d)};
 if(d===0)return {k:'now',txt:U('dueToday')};
 return {k:'now',txt:U('overdue')};
}

 <details class="card" open><summary><b>🧳 ${U('prepT')}</b> <span class="pill open num">${prepDone}/${PREP.length}</span></summary><p class="small muted" style="margin:6px 0 10px">${U('prepSub')}</p>${adminBox()}

 <details class="card" open><summary><b>🗳️ ${U('voteT')}</b> <span class="pill warn">${voteKeys.length}</span></summary><p class="small muted" style="margin:6px 0 10px">${U('voteSub')}</p>
 <ul class="hublist">${voteKeys.map(k=>{const {t,mine}=voteTally(k);const n=Object.values(t).reduce((a,v)=>a+v.length,0);let lead=null,max=0;Object.entries(t).forEach(([i,v])=>{if(v.length>max){max=v.length;lead=+i}});const day=Object.entries(OLINK).filter(([kk,v])=>v.includes(k)).map(([kk])=>kk.split('-')[0]);const dates=[...new Set(day)].map(n=>DAYS[n-1].date.slice(5).replace('-','/')).join('、');
  return `<li><span>🔀</span><div style="min-width:0;flex:1"><b>${esc(L(OPTS[k].t))}</b><div class="small muted">${dates}${SYNC.db&&SYNC.crewOK?` · ${U('votes',n)}${lead!=null?` · ${U('leading')}：${esc(L(OPTS[k].o[lead][0]))}`:''}`:''}${mine!=null?` · ✓ ${U('myPick')}：${esc(L(OPTS[k].o[mine][0]))}`:''}</div></div><button class="btn sm" type="button" data-opts="${k}">${mine!=null?U('change'):U('goVote')}</button></li>`}).join('')}</ul></details>

const SYNC={db:null,user:null,me:null,canTasks:false,tasks:{},crew:{},crewOK:false,names:{},nameKey:''};
function taskDone(id){return SYNC.db?!!(SYNC.tasks[id]&&SYNC.tasks[id].done):store.get('task-'+id,false)}
function myState(){
 const loc=store.get('mine',null)||{pack:{},bingo:{},votes:{}};
 const src=(SYNC.crewOK&&SYNC.me&&SYNC.crew[SYNC.me])?SYNC.crew[SYNC.me]:loc;
 return {pack:{...(src.pack||{})},bingo:{...(src.bingo||{})},votes:{...(src.votes||{})}};
}
let pendingMine=null,writingMine=false;
function saveMine(s){
 store.set('mine',s);
 if(!(SYNC.db&&SYNC.me&&SYNC.crewOK))return;
 if(SYNC.mode==='cf'&&!CF.code)return;
 SYNC.crew[SYNC.me]={...s,at:Date.now()};
 pendingMine={pack:s.pack,bingo:s.bingo,votes:s.votes||{},at:Date.now()};flushMine();
}
async function flushMine(){
 if(writingMine)return;writingMine=true;
 while(pendingMine){const p=pendingMine;pendingMine=null;
  if(SYNC.mode==='cf'){try{const r=await fetch('/api/me',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:SYNC.me,name:CF.name,code:CF.code,...p})});if(r.status===403){CF.code='';store.set('code','');render()}}catch(e){}if(!pendingMine)cfPull();continue}
  try{await SYNC.db.doc('crew/'+SYNC.me).set(p)}catch(e){if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')){SYNC.crewOK=false;pendingMine=null;render()}}}
 writingMine=false;
}
async function setTask(id,done){
 if(!SYNC.db){store.set('task-'+id,done);render();return}
 if(!SYNC.canTasks){render();return}
 const next={...SYNC.tasks,[id]:{done,by:SYNC.me||'',at:Date.now()}};

/* ---------- time ---------- */
let simTs=null;
const nowTs=()=>simTs??Date.now();
const ts=(date,hm)=>Date.parse(`${date}T${hm}:00+09:00`);
DAYS.forEach(d=>d.items.forEach(it=>{it.S=ts(d.date,it.s);it.E=ts(d.date,it.e)}));
const TRIP_S=DAYS[0].items[0].S, TRIP_E=DAYS[5].items.at(-1).E;
const jstDate=t=>new Date(t+9*3600e3).toISOString().slice(0,10);
const daysBetween=(fromTs,dateStr)=>Math.round((Date.parse(dateStr+'T00:00:00+09:00')-Date.parse(jstDate(fromTs)+'T00:00:00+09:00'))/864e5);
function itemState(it){const n=nowTs();return n>=it.E?'past':n>=it.S?'now':'next'}
function tripStatus(){
 const n=nowTs();
 if(n<TRIP_S) return {k:'before',days:daysBetween(n,DAYS[0].date)};
 if(n>=TRIP_E) return {k:'after'};
 for(const d of DAYS){
   const its=d.items;
   if(n<its[0].S) return {k:'rest',day:d,next:its[0]};
   if(n<its.at(-1).E){
     const cur=its.find(i=>n>=i.S&&n<i.E);
     if(cur) return {k:'now',day:d,cur,next:its[its.indexOf(cur)+1]};
     return {k:'move',day:d,next:its.find(i=>i.S>n)};
   }
 }
 return {k:'after'};
}
function todayDay(){const s=tripStatus();return s.day&&s.k!=='rest'?s.day:(s.k==='rest'?s.day:null)}
const fmtTime=t=>new Date(t+9*3600e3).toISOString().slice(11,16);
function taskState(t){
 if(taskDone(t.id)) return {k:'done',txt:U('doneP')};
 if(t.open==='onsite') return {k:'warn',txt:U('onsite')};
 if(!t.open) return {k:'open',txt:U('openNow')};
 const d=daysBetween(nowTs(),t.open);
 if(d>0) return {k:'wait',txt:U('opensIn',d),d};
 if(d===0) return {k:'now',txt:U('opensToday'),d};
 return {k:'open',txt:U('openNow'),d};
}

function calc(from){
 const R=document.getElementById('fxR'),J=document.getElementById('fxJ'),T=document.getElementById('fxT');if(!R)return;
 const r=parseFloat(R.value)||0;
 if(from==='j'){const v=parseFloat(J.value);T.value=isNaN(v)?'':Math.round(v*r)}
 else{const v=parseFloat(T.value);J.value=isNaN(v)||!r?'':Math.round(v/r)}
}
document.getElementById('fx').addEventListener('input',e=>{
 if(e.target.id==='fxR'){rate=parseFloat(e.target.value)||0;store.set('rate',rate);calc('j')}
 if(e.target.id==='fxJ')calc('j');
 if(e.target.id==='fxT')calc('t');
});
document.getElementById('fx').addEventListener('click',e=>{const q=e.target.closest('[data-fxq]');if(q){document.getElementById('fxJ').value=q.dataset.fxq;calc('j')}});

/* ---------- boot ---------- */
try{const q=new URLSearchParams(location.search);const ql=(q.get('lang')||'').toLowerCase();if(ql){lang=ql.startsWith('ja')?'ja':ql.startsWith('en')?'en':'zh'}const qd=q.get('day');if(qd&&/^[1-6]$/.test(qd)&&!location.hash)history.replaceState(null,'','#day-'+qd);}catch(e){}
const h0=location.hash.slice(1);
if(h0)view=h0;else view='simple';
go(view);
if(!store.get('helpSeen',false))openHelp();
initSync().catch(()=>{});
setInterval(()=>{if(simTs==null&&document.getElementById("ov").hidden&&!document.querySelector(".ti.open")&&!document.activeElement?.matches("input"))render()},60000);
})();
</script>

</body>
</html>
